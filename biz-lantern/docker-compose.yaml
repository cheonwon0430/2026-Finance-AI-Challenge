services:
  postgres:
    image: pgvector/pgvector:pg18 # Include pgvector, PostgreSQL
    container_name: biz-lantern-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: biz_lantern
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      # 127.0.0.1 로 묶는다. 이 줄이 "5432:5432" 면 공개 서버에서 postgres/postgres 인
      # DB 가 인터넷에 그대로 열린다. 로컬 개발(호스트에서 uv run fastapi dev)은 그대로 된다.
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    # backend 가 기동하자마자 create_all 을 돌린다. DB 가 아직 안 떠 있으면 그대로 죽으므로
    # "컨테이너가 떴다" 가 아니라 "접속을 받는다" 를 기다려야 한다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biz_lantern"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./apps/backend
    container_name: biz-lantern-backend
    restart: unless-stopped

    env_file:
      - ./apps/backend/.env

    environment:
      # env_file 보다 우선한다. 로컬 .env 에는 localhost 가 적혀 있는데 컨테이너 안에서
      # localhost 는 자기 자신이다. 여기서 못 박아 그 실수를 아예 없앤다.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/biz_lantern

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      # 이게 없으면 재배포마다 만들어둔 보고서가 전부 사라지고 CORPCODE.xml 을 다시 받는다.
      - backend_data:/app/data

    # 호스트 포트를 열지 않는다. nginx 가 같은 네트워크에서 backend:8000 으로 프록시하므로
    # 필요가 없고, 열어두면 팀원이 로컬에서 돌리는 `uv run fastapi dev`(같은 8000)와 부딪힌다.
    # 컨테이너를 직접 찔러볼 때는 docker compose exec backend 를 쓴다.
    expose:
      - "8000"

  frontend:
    build:
      # pnpm 워크스페이스라 lock 파일이 루트에 있다. 컨텍스트는 리포 루트다.
      context: .
      dockerfile: apps/frontend/Dockerfile

    container_name: biz-lantern-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_data:
