server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA. react-router 가 /companies/:id 같은 경로를 쓰므로 새로고침이 404 가 되지 않게
    # 없는 경로는 전부 index.html 로 돌린다.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # /api 를 백엔드로 넘긴다. 이래야 프론트가 API 주소를 몰라도 되고 같은 출처가 되어
    # CORS 가 아예 발동하지 않는다.
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 기본 60초로는 부족하다. GET /companies/{name} 이 DART 문서를 받고 파싱하느라
        # 수십 초가 걸린다(보고서 생성 POST 는 202 로 즉시 끊기므로 상관없다).
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
